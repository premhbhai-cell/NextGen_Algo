<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin Panel | Smart Skills AI</title><link rel="stylesheet" href="css/panel.css"><script src="scripts/theme.js"></script></head><body class="wp">
<div id="lg" class="box" style="display:none"><div class="card"><h2 style="margin-top:0;color:#2563eb">Admin Login</h2><input id="ae" type="email" placeholder="Admin email"><input id="ap" type="password" placeholder="Password"><button style="width:100%" onclick="go()">Login</button><div class="err" id="er"></div></div></div>
<div id="pn" style="display:none"><div class="shell" id="app"></div></div>
<script src="scripts/auth.js"></script><script>
function boot(){var ok=!!sess('admin');$('#lg').style.display=ok?'none':'';$('#pn').style.display=ok?'':'none';if(ok)render()}
function go(){if(adminLogin($('#ae').value,$('#ap').value))boot();else $('#er').textContent='Incorrect email address or password.'}
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!sess('admin'))go()});
function c(k,v){return'<div class="card"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
function bd(s){return'<span class="badge '+(s==='approved'||s==='active'?'ok':s==='rejected'||s==='blocked'?'bad':'pen')+'">'+(s==='awaiting'?'awaiting payment':s)+'</span>'}
function uname(d,id){var u=d.users.find(function(x){return x.id===id});return u?esc(u.name)+' <span class="k">('+esc(u.email)+')</span>':'deleted'}
function val(id){var e=$('#'+id);return e?e.value:''}
function render(){var d=load(),C=d.cfg,q=val('sq').toLowerCase(),pend=d.reqs.filter(function(r){return r.status==='pending'}),pw=d.wds.filter(function(r){return r.status==='pending'}),ot=d.tix.filter(function(t){return!t.reply}),bal=0;
d.users.forEach(function(u){bal+=u.wallet});
var us=d.users.filter(function(u){return!q||(u.name+u.email+u.phone+u.code+u.mt5).toLowerCase().indexOf(q)>-1});
var P={};P.dash='<div class="grid">'+c('Total Users',d.users.length)+c('Active Robots',d.users.filter(function(u){return u.pkg&&(u.exp===null||u.exp>Date.now())}).length)+c('Pending Package Requests',pend.length)+c('Pending Withdrawals',pw.length)+c('Open Support Tickets',ot.length)+c('Total User Wallets',money(bal))+'</div>';
P.req='<div class="card"><h3>Package Requests</h3><div class="tw"><table><tr><th>Date</th><th>User</th><th>Package</th><th>Price</th><th>TXID</th><th>Status</th><th></th></tr>'+
d.reqs.slice().reverse().map(function(r){return'<tr><td>'+dt(r.t)+'</td><td>'+uname(d,r.uid)+'</td><td>'+esc(r.name)+'</td><td>'+money(r.price)+'</td><td style="word-break:break-all;max-width:220px">'+esc(r.txid||'-')+'</td><td>'+bd(r.status)+'</td><td>'+(r.status==='pending'?'<button class="g" onclick="reqOk(\''+r.id+'\')">Approve</button><button class="r" onclick="reqNo(\''+r.id+'\')">Reject</button>':'')+'</td></tr>'}).join('')+'</table></div></div>';
P.wd='<div class="card"><h3>Withdrawals</h3><div class="tw"><table><tr><th>Date</th><th>User</th><th>Amount</th><th>To</th><th>Status</th><th></th></tr>'+
d.wds.slice().reverse().map(function(r){return'<tr><td>'+dt(r.t)+'</td><td>'+uname(d,r.uid)+'</td><td>'+money(r.amt)+'</td><td>'+esc(r.to)+'</td><td>'+bd(r.status)+'</td><td>'+(r.status==='pending'?'<button class="g" onclick="wdOk(\''+r.id+'\')">Approve</button><button class="r" onclick="wdNo(\''+r.id+'\')">Reject</button>':'')+'</td></tr>'}).join('')+'</table></div></div>';
P.tix='<div class="card"><h3>Support Tickets</h3><div class="tw"><table><tr><th>Date</th><th>User</th><th>Message</th><th>Reply</th><th></th></tr>'+
d.tix.slice().reverse().map(function(t){return'<tr><td>'+dt(t.t)+'</td><td>'+uname(d,t.uid)+'</td><td>'+esc(t.msg)+'</td><td>'+esc(t.reply)+'</td><td><button onclick="rep(\''+t.id+'\')">Reply</button></td></tr>'}).join('')+'</table></div></div>';
P.users='<div class="card"><h3>All Users</h3><input id="sq" placeholder="Search name / email / phone / code / MT5" value="'+esc(val('sq'))+'" oninput="render();var e=$(\'#sq\');e.focus();e.setSelectionRange(99,99)"><div class="tw"><table><tr><th>User</th><th>Phone</th><th>Code / Sponsor</th><th>Package</th><th>MT5 / License</th><th>Wallet</th><th>Status</th><th>Actions</th></tr>'+
us.map(function(u){var sp=u.sponsor?uname(d,u.sponsor):'-';return'<tr><td>'+esc(u.name)+(u.dia?' 💎':'')+'<br><span class="k">'+esc(u.email)+'</span></td><td>'+esc(u.phone)+'</td><td>'+esc(u.code)+'<br>'+sp+'</td><td>'+esc(pkgInfo(u))+'</td><td>'+esc(u.mt5||'-')+' '+esc(u.srv)+'<br><b>'+esc(u.lic||'no key')+'</b></td><td>'+money(u.wallet)+'</td><td>'+bd(u.status)+'</td><td>'+
'<select id="pk'+u.id+'" style="width:auto">'+C.plans.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+'</option>'}).join('')+'</select><button onclick="setPkg(\''+u.id+'\')">Activate</button>'+
'<button class="y" onclick="tog(\''+u.id+'\')">'+(u.status==='blocked'?'Unblock':'Block')+'</button><button class="g" onclick="cr(\''+u.id+'\')">+/- Wallet</button><button onclick="lic(\''+u.id+'\')">License</button><button class="o" onclick="dia(\''+u.id+'\')">'+(u.dia?'Remove 💎':'Make 💎')+'</button><button class="o" onclick="rp(\''+u.id+'\')">Reset Pass</button><button class="r" onclick="del(\''+u.id+'\')">Delete</button></td></tr>'}).join('')+'</table></div></div>';
P.ref='<div class="card"><h3>Admin Referral Codes</h3><p>Create promotional referral codes for new registrations. Users can enter these codes in the sign-up form.</p><div class="pl"><input id="newref" placeholder="Optional custom code (e.g. WELCOME2026)"><button onclick="makeRef()">Generate Referral Code</button></div><div class="tw"><table><tr><th>Code</th><th>Created</th><th>Status</th><th>Action</th></tr>'+((C.referralCodes||[]).slice().reverse().map(function(x){return'<tr><td><b>'+esc(x.code)+'</b></td><td>'+dt(x.created)+'</td><td>'+(x.active===false?'Disabled':'Active')+'</td><td><button class="o" onclick="toggleRef(\''+esc(x.code)+'\')">'+(x.active===false?'Enable':'Disable')+'</button></td></tr>'}).join('')||'<tr><td colspan="4">No administrator referral codes have been created.</td></tr>')+'</table></div></div>';
P.pool='<div class="card"><h3>💎 Diamond Pool</h3><p>Achievers: <b>'+d.users.filter(function(u){return u.dia}).length+'</b> &nbsp; <button onclick="pool()">Distribute Pool</button></p><p class="k">Enter total company business to distribute 10% equally among all Diamond achievers.</p></div>';
P.set='<div class="card"><h3>Settings</h3><div class="k">Direct income %</div><input id="cd" type="number" value="'+C.direct+'"><div class="k">Level income % (10 levels, comma separated)</div><input id="cl" value="'+C.lv.join(',')+'"><div class="k">Withdrawal income % per level (10 levels)</div><input id="cw" type="number" value="'+C.wdl+'">'+
'<div class="k">Notice for users</div><input id="cn" value="'+esc(C.notice)+'"><div class="k">Bonanza offers (visible to users)</div><input id="cb" value="'+esc(C.bonanza)+'"><div class="k">Zoom link</div><input id="cz" value="'+esc(C.zoom)+'"><div class="k">Marketing kit link</div><input id="ck" value="'+esc(C.kit)+'"><div class="k">Admin WhatsApp number or wa.me link</div><input id="cwa" value="'+esc(C.wa)+'">'+
C.plans.map(function(p,i){return'<div class="k" style="margin-top:8px">'+esc(p.name)+' — price ($) / days (0 = lifetime)</div><div style="display:flex;gap:8px"><input id="pp'+i+'" type="number" value="'+p.price+'"><input id="pd'+i+'" type="number" value="'+p.days+'"></div>'}).join('')+'<button style="margin-top:10px" onclick="cfg()">Save Settings</button></div>';
var T=[['dash','Dashboard','🏠',0],['users','Users','👥',0],['req','Package Requests','📦',pend.length],['ref','Referral Codes','🎟️',(C.referralCodes||[]).length],['wd','Withdrawals','💸',pw.length],['tix','Support','💬',ot.length],['pool','Diamond Pool','💎',0],['set','Settings','⚙️',0]],tab=tabFrom(T,'dash');
$('#app').innerHTML=shell('Smart Skills <b>AI</b><small>Admin Panel</small>',T,tab,'Welcome, Admin',"logout('admin','admin.html')",P[tab])}
function W(f){var d=load();f(d);save(d);render()}
function makeRef(){var v=val('newref').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'');if(!v)v='WELCOME'+Math.random().toString(36).slice(2,7).toUpperCase();var d=load();d.cfg.referralCodes=d.cfg.referralCodes||[];if(d.cfg.referralCodes.some(function(x){return x.code===v})||d.users.some(function(u){return u.code===v})){alert('This code already exists.');return}d.cfg.referralCodes.push({code:v,created:Date.now(),active:true});save(d);render();alert('Referral code created: '+v)}
function toggleRef(code){W(function(d){var x=(d.cfg.referralCodes||[]).find(function(a){return a.code===code});if(x)x.active=x.active===false})}

function G(d,id){return d.users.find(function(u){return u.id===id})}
function reqOk(id){var before=load(),request=before.reqs.find(function(x){return x.id===id}),buyer=request&&G(before,request.uid),plan=request&&before.cfg.plans.find(function(x){return x.id===request.planId});if(!request||request.status!=='pending')return;if(!buyer||!plan){W(function(d){var r=d.reqs.find(function(x){return x.id===id});if(r)r.status='rejected'});return}W(function(d){var r=d.reqs.find(function(x){return x.id===id}),u=G(d,r.uid),p=d.cfg.plans.find(function(x){return x.id===r.planId});if(!r||r.status!=='pending'||!u||!p)return;r.status='approved';activate(d,u,p)});if(buyer.phone){var message='Hello '+buyer.name+', your '+plan.name+' subscription with SmartSkillsAI.in has been approved and activated. Please log in to your User Panel to view your package and license details. Our support team can assist with MT5 installation and setup. Thank you.';window.open(waLink(buyer.phone,message),'_blank')}}
function reqNo(id){W(function(d){var r=d.reqs.find(function(x){return x.id===id});if(r&&r.status==='pending')r.status='rejected'})}
function wdOk(id){W(function(d){var r=d.wds.find(function(x){return x.id===id});if(!r||r.status!=='pending')return;r.status='approved';var u=G(d,r.uid);if(u)wdIncome(d,u,r.amt)})}
function wdNo(id){W(function(d){var r=d.wds.find(function(x){return x.id===id});if(!r||r.status!=='pending')return;r.status='rejected';var u=G(d,r.uid);if(u)u.wallet+=r.amt})}
function setPkg(id){W(function(d){var u=G(d,id),p=d.cfg.plans.find(function(x){return x.id===$('#pk'+id).value});if(u&&p)activate(d,u,p)})}
function tog(id){W(function(d){var u=G(d,id);if(u)u.status=u.status==='blocked'?'active':'blocked'})}
function dia(id){W(function(d){var u=G(d,id);if(u)u.dia=!u.dia})}
function lic(id){var d=load(),u=G(d,id);if(!u)return;var k=prompt('License key for '+u.name,u.lic);if(k===null)return;u.lic=k.trim();save(d);render()}
function rep(id){var d=load(),t=d.tix.find(function(x){return x.id===id});if(!t)return;var r=prompt('Reply:',t.reply);if(r===null)return;t.reply=r.trim();save(d);render()}
function cr(id){var t=prompt('Format: type amount\nType = direct, level, wd, pool, bonus, adj\nExample: bonus 50   (minus: adj -20)');if(!t)return;var a=t.trim().split(/\s+/),k=a[0].toLowerCase(),n=parseFloat(a[1]);
 if(!(k in {direct:1,level:1,wd:1,pool:1,bonus:1,adj:1})||isNaN(n)){alert('Invalid format.');return}
 W(function(d){var u=G(d,id);if(!u)return;if(u.wallet+n<0){alert('Wallet balance cannot be negative.');return}if(k==='adj'||n<0)u.wallet+=n,u.tx.push({t:Date.now(),type:k,amt:n,note:'Admin'});else pay(u,k,n,'Admin')})}
function pool(){var b=parseFloat(prompt('Total company business ($)?'));if(!(b>0))return;W(function(d){var a=d.users.filter(function(u){return u.dia});if(!a.length){alert('No Diamond achievers are available.');return}var e=b*.1/a.length;if(!confirm('Each achiever will receive '+money(e)+'  ('+a.length+' achievers). Confirm distribution?'))return;a.forEach(function(u){pay(u,'pool',e,'Diamond Pool')})})}
function rp(id){var p=prompt('New password (minimum 6 characters)');if(!p)return;if(p.length<6){alert('Password must contain at least 6 characters.');return}W(function(d){var u=G(d,id);if(u)u.pw=p})}
function del(id){if(!confirm('Delete this user?'))return;W(function(d){d.users=d.users.filter(function(u){return u.id!==id});d.users.forEach(function(u){if(u.sponsor===id)u.sponsor=null});d.reqs=d.reqs.filter(function(r){return r.uid!==id});d.wds=d.wds.filter(function(r){return r.uid!==id});d.tix=d.tix.filter(function(r){return r.uid!==id})})}
function cfg(){var a=parseFloat($('#cd').value),w=parseFloat($('#cw').value),l=$('#cl').value.split(',').map(function(x){return parseFloat(x)});
 if(isNaN(a)||isNaN(w)||a<0||w<0||l.length!==10||l.some(function(x){return isNaN(x)||x<0})){alert('Enter valid percentages (provide exactly 10 comma-separated level values).');return}
 W(function(d){var C=d.cfg;C.direct=a;C.wdl=w;C.lv=l;C.notice=$('#cn').value.trim();C.bonanza=$('#cb').value.trim();C.zoom=$('#cz').value.trim();C.kit=$('#ck').value.trim();C.wa=$('#cwa').value.trim();C.plans.forEach(function(p,i){var pr=parseFloat($('#pp'+i).value),dy=parseInt($('#pd'+i).value,10);if(!isNaN(pr)&&pr>=0)p.price=pr;if(!isNaN(dy)&&dy>=0)p.days=dy})});alert('Saved')}
boot();window.addEventListener('storage',function(){var a=document.activeElement;if(sess('admin')&&(!a||a.tagName!=='INPUT'))render()});
</script></body></html>

<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>User Panel | Smart Skills AI</title><link rel="stylesheet" href="css/panel.css"><script src="scripts/theme.js"></script></head><body class="wp">
<div class="shell" id="app"></div>
<script src="scripts/auth.js"></script><script>
var S=sess('user');if(!S)location.href='login.html';
function me(d){return d.users.find(function(u){return u.id===S.id})}
function c(k,v){return'<div class="card"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'}
function row(r,t,x){return'<tr><td>'+dt(r.t)+'</td><td>'+t+'</td><td>'+x+'</td><td><span class="badge '+(r.status==='approved'?'ok':r.status==='rejected'?'bad':'pen')+'">'+r.status+'</span></td></tr>'}
function lnk(l,t){return l?'<a href="'+esc(l)+'" target="_blank" rel="noopener">'+t+'</a>':'<span class="k">'+t+' (Coming soon)</span>'}
var keep={};function val(id){var e=$('#'+id);return e?e.value:''}
function render(){var d=load(),u=me(d);if(!u||u.status==='blocked'){logout('user','login.html');return}
var team=d.users.filter(function(x){return x.sponsor===u.id}),lv=levels(d,u),all=lv.reduce(function(a,b){return a+b},0),tot=0;for(var k in u.earn)tot+=u.earn[k];
var act=u.pkg&&(u.exp===null||u.exp>Date.now()),base=location.href.replace(/user\.html.*$/,''),link=base+'login.html?ref='+u.code,C=d.cfg;
var P={};P.dash=(C.notice?'<div class="card ban"><b>📢 Notice:</b> '+esc(C.notice)+'</div>':'')+'<h2>Welcome, '+esc(u.name)+(u.dia?' 💎':'')+'</h2><div class="grid">'+
c('Wallet Balance',money(u.wallet))+c('Total Earnings',money(tot))+c('My Package',esc(pkgInfo(u)))+c('Robot Status',act?'<span class="badge ok">Active</span>':'<span class="badge bad">Inactive</span>')+c('Total Team (10 Levels)',all)+'</div>';
P.robot='<div class="card"><h3>🤖 My MT5 Trading Robot</h3><div class="k">MT5 Account Number</div><input id="m1" value="'+esc(u.mt5)+'"><div class="k">Broker Server</div><input id="m2" value="'+esc(u.srv)+'"><button onclick="mt()">Save MT5 Details</button><p>License Key: <b>'+esc(u.lic||'Provided by the administrator after package approval')+'</b></p><p>'+lnk(C.zoom,'🎥 Live Zoom Training')+' &nbsp; '+lnk(C.kit,'📣 Marketing Kit')+' &nbsp; '+lnk(C.wa,'💬 WhatsApp Support')+'</p></div>';
P.ref='<div class="card"><h3>Referral</h3>Code: <b>'+esc(u.code)+'</b><input readonly value="'+esc(link)+'" onclick="this.select()"></div>';
P.earn='<div class="card"><h3>Earnings</h3><div class="grid">'+c('Direct (10%)',money(u.earn.direct))+c('Level',money(u.earn.level))+c('Withdrawal',money(u.earn.wd))+c('Diamond Pool',money(u.earn.pool))+c('Bonanza',money(u.earn.bonus))+'</div></div>';
P.hist='<div class="card"><h3>Income History</h3><div class="tw"><table><tr><th>Date</th><th>Type</th><th>Amount</th><th>Note</th></tr>'+u.tx.slice(-25).reverse().map(function(t){return'<tr><td>'+dt(t.t)+'</td><td>'+esc(t.type)+'</td><td>'+money(t.amt)+'</td><td>'+esc(t.note)+'</td></tr>'}).join('')+'</table></div></div>';
P.buy='<div class="card"><h3>🤖 MT5 Trading Robot Packages — Buy 2 Get 1 FREE</h3>'+C.plans.map(function(p){return'<div class="pl"><span>'+esc(p.name)+' — <b>'+money(p.price)+'</b></span><a class="btn" href="package.html?p='+p.id+'">View &amp; Buy</a></div>'}).join('')+'<p class="k">Review the package details, pay using USDT (BEP20), and submit your transaction hash. The administrator will review and approve your request.</p></div>';
P.wd='<div class="card"><h3>Withdraw</h3><input id="wa" type="number" min="1" step="any" placeholder="Amount ($)" value="'+esc(val('wa'))+'"><input id="wt" placeholder="UPI ID / Wallet address" value="'+esc(val('wt'))+'"><button onclick="wd()">Request Withdrawal</button><div class="err" id="er"></div></div>';
P.myreq='<div class="card"><h3>My Requests</h3><div class="tw"><table><tr><th>Date</th><th>Type</th><th>Details</th><th>Status</th></tr>'+
d.reqs.filter(function(r){return r.uid===u.id}).map(function(r){return row(r,'Package',esc(r.name)+(r.status==='awaiting'?' <a href="payment.html?o='+r.id+'">Pay now</a>':''))}).concat(d.wds.filter(function(r){return r.uid===u.id}).map(function(r){return row(r,'Withdraw',money(r.amt)+' → '+esc(r.to))})).join('')+'</table></div></div>';
P.team='<div class="card"><h3>My Team</h3><div class="tw"><table><tr><th>Level</th>'+lv.map(function(_,i){return'<th>L'+(i+1)+'</th>'}).join('')+'</tr><tr><td>Members</td>'+lv.map(function(n){return'<td>'+n+'</td>'}).join('')+'</tr></table></div><br><div class="tw"><table><tr><th>Direct Member</th><th>Joined</th><th>Package</th></tr>'+team.map(function(x){return'<tr><td>'+esc(x.name)+'</td><td>'+dt(x.joined)+'</td><td>'+esc(pkgInfo(x))+'</td></tr>'}).join('')+'</table></div></div>';
P.sup='<div class="card"><h3>💬 Support</h3><input id="tm" placeholder="Enter your message" value="'+esc(val('tm'))+'"><button onclick="tk()">Send to Admin</button>'+d.tix.filter(function(t){return t.uid===u.id}).reverse().map(function(t){return'<div class="pl" style="display:block"><b>You:</b> '+esc(t.msg)+'<br><b>Admin:</b> '+(t.reply?esc(t.reply):'<span class="k">Reply pending</span>')+'</div>'}).join('')+'</div>';
P.prof='<div class="card"><h3>Profile</h3><input id="pn" value="'+esc(val('pn')||u.name)+'"><input id="pph" placeholder="Phone" value="'+esc(val('pph')||u.phone)+'"><input id="ppw" type="password" placeholder="New password (optional, minimum 6 characters)"><button onclick="pf()">Update Profile</button><div class="err" id="er2"></div></div>';
var T=[['dash','Dashboard','🏠'],['robot','My Robot','🤖'],['earn','Earnings','💰'],['pkg','Packages','📦'],['plan','Income Plan','📊'],['wd','Withdraw','💸'],['team','My Team','👥'],['sup','Support','💬'],['prof','Profile','👤']],tab=tabFrom(T,'dash');
var ET=[['direct','Direct Income','#f59e0b'],['level','Level Income','#3b82f6'],['wd','Withdrawal Income','#10b981'],['pool','Diamond Pool','#8b5cf6'],['bonus','Bonanza','#ec4899']];
P.plan='<div class="card ban"><b>🎁 Buy 2 Get 1 FREE Strategy</b> — offer ke terms admin announce karega.</div><div class="card"><h3>📊 My Income Distribution</h3>'+ET.map(function(e){var v=u.earn[e[0]],pc=tot?Math.round(v/tot*100):0;return'<div style="margin:10px 0"><div style="display:flex;justify-content:space-between"><span>'+e[1]+'</span><b>'+money(v)+' ('+pc+'%)</b></div><div class="bar2"><i style="width:'+pc+'%;background:'+e[2]+'"></i></div></div>'}).join('')+'</div>'+
'<div class="card"><h3>💰 Income Types</h3><div class="pl"><span>1️⃣ Direct Income</span><b>'+C.direct+'% on every direct package</b></div><div class="pl"><span>2️⃣ Level Income (10 levels)</span><b>Total '+C.lv.reduce(function(a,b){return a+b},0)+'%</b></div><div class="pl"><span>3️⃣ Withdrawal Income</span><b>'+C.wdl+'% × 10 levels = '+C.wdl*10+'%</b></div><div class="pl"><span>4️⃣ 💎 Diamond Pool</span><b>10% of total business, shared equally</b></div><div class="pl"><span>5️⃣ 🎉 Bonanza</span><b>Time to time offers</b></div></div>'+
'<div class="card"><h3>🪜 Level-wise Plan</h3><div class="tw"><table><tr><th>Level</th><th>Level Income</th><th>Withdrawal Income</th><th>My Members</th></tr>'+C.lv.map(function(x,i){return'<tr><td>'+(i%2?'🔹':'🥉')+' Level '+(i+1)+'</td><td>'+x+'%</td><td>'+C.wdl+'%</td><td>'+lv[i]+'</td></tr>'}).join('')+'</table></div></div>'+
'<div class="card"><h3>🎉 Bonanza Offers</h3>'+(C.bonanza?esc(C.bonanza):'<span class="k">No bonanza offer is currently available. New offers will be announced here.</span>')+'</div>';
P.pkg=P.buy+P.myreq;P.wd=P.wd+P.myreq;P.earn=P.earn+P.hist;P.dash+=P.ref;
$('#app').innerHTML=shell('Smart Skills <b>AI</b><small>User Panel</small>',T,tab,'Hello, '+esc(u.name),"logout('user','login.html')",P[tab])}
function W(f){var d=load(),u=me(d);if(!u)return;var m=f(d,u);if(m!==false)save(d);render()}
function mt(){W(function(d,u){u.mt5=$('#m1').value.trim();u.srv=$('#m2').value.trim()});alert('Saved successfully')}
function buy(pid){W(function(d,u){var p=d.cfg.plans.find(function(x){return x.id===pid});if(!p)return false;
 if(d.reqs.some(function(r){return r.uid===u.id&&r.planId===pid&&r.status==='pending'})){alert('A request for this package is already pending.');return false}
 d.reqs.push({id:uid('R'),uid:u.id,planId:p.id,name:p.name,price:p.price,t:Date.now(),status:'pending'});alert('Request submitted successfully')})}
function wd(){var a=parseFloat($('#wa').value),t=$('#wt').value.trim(),m='';W(function(d,u){
 if(!(a>0))m='Please enter a valid amount.';else if(a>u.wallet)m='Insufficient wallet balance.';else if(!t)m='Please enter a UPI ID or wallet address.';
 if(m)return false;u.wallet-=a;d.wds.push({id:uid('W'),uid:u.id,amt:a,to:t,t:Date.now(),status:'pending'});$('#wa').value='';$('#wt').value=''});if(m)$('#er').textContent=m}
function tk(){var m=$('#tm').value.trim();if(!m)return;W(function(d,u){d.tix.push({id:uid('T'),uid:u.id,msg:m,t:Date.now(),reply:''});$('#tm').value=''})}
function pf(){var n=$('#pn').value.trim(),ph=$('#pph').value.trim(),pw=$('#ppw').value,m='';W(function(d,u){if(!n)m='Name is required';else if(pw&&pw.length<6)m='Password must contain at least 6 characters';if(m)return false;u.name=n;u.phone=ph;if(pw)u.pw=pw;$('#ppw').value=''});if(m)$('#er2').textContent=m;else alert('Profile updated successfully')}
render();window.addEventListener('storage',function(){var a=document.activeElement;if(!a||a.tagName!=='INPUT')render()});
</script></body></html>
